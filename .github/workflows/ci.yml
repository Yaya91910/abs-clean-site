name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AbsClean.slnx
      - run: dotnet build AbsClean.slnx --no-restore --configuration Release
      - run: dotnet test AbsClean.slnx --no-build --configuration Release
      - name: Migrations EF Core à jour
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project api

  web:
    name: Web (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  e2e:
    name: Parcours complet (Playwright)
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16
        env:
          # Base jetable du conteneur de CI, détruite à la fin du job : pas un secret.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abs_clean_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_CONNECTION_STRING: Host=localhost;Database=abs_clean_e2e;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: dotnet build api
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
