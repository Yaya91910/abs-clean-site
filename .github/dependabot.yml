# Mises à jour automatiques des dépendances : une PR par semaine et par écosystème,
# vérifiée par la CI (tests API, site, parcours complet, image Docker) avant toute fusion.
version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/api", "/api/Tests"]
    schedule: { interval: weekly, day: monday }
    groups:
      dotnet: { patterns: ["*"], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      angular: { patterns: ["@angular/*", "@angular-devkit/*"] }
      autres: { patterns: ["*"], exclude-patterns: ["@angular/*", "@angular-devkit/*"], update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly, day: monday }
    groups:
      e2e: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
